name: Security OAuth client capacity
on:
  pull_request:
    paths:
      - 'lib/oauth.mjs'
      - 'test/oauth-capacite.test.mjs'
      - 'test/compte.test.mjs'
      - '.github/workflows/security-oauth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Europe/Paris # la suite GTFS existante attend les heures locales de Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: OAuth capacity regression
        run: node --test test/oauth-capacite.test.mjs
      - name: Existing test suite
        run: npm test
